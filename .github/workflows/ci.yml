name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      upload-distributions:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --locked
      - name: Test with coverage
        if: matrix.python-version == '3.13'
        run: uv run --no-sync pytest --cov --cov-report=term-missing
      - name: Test
        if: matrix.python-version != '3.13'
        run: uv run --no-sync pytest

  quality-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --locked
      - name: Check versions
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: uv run --no-sync python scripts/check_versions.py --tag "$RELEASE_TAG"
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Format
        run: uv run --no-sync ruff format --check .
      - name: Type check
        run: uv run --no-sync pyright
      - name: Check localized docs
        run: uv run --no-sync python scripts/check_i18n.py
      - name: Build documentation
        run: uv run --no-sync mkdocs build --strict
      - name: Build distributions
        run: uv run --no-sync python -m build
      - name: Store distributions
        if: inputs.upload-distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
