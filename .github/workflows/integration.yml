name: Data integration

on:
  schedule:
    - cron: "41 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zenodo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --frozen
      - name: Read the smallest real flight file
        env:
          MAGNAV_INTEGRATION: "1"
        run: uv run pytest -m integration
