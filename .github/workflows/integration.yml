name: Data integration

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  zenodo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --locked
      - name: Check bundled catalog against Zenodo
        run: uv run --no-sync python scripts/update_catalog.py --check
      - name: Verify both published flight collections
        env:
          MAGNAV_INTEGRATION: "1"
        run: uv run --no-sync pytest -m integration
