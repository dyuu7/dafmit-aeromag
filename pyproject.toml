[project]
name = "dafmit-aeromag"
version = "0.4.0"
description = "A Python interface to the DAF-MIT AIA open flight dataset for aircraft magnetic interference compensation and MagNav research."
requires-python = ">=3.10"
dependencies = [
    "h5py>=3.9",
    "numpy>=1.26",
    "pandas>=2.1",
    "pooch[progress]>=1.8",
]
authors = [{ name = "dyuu7" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "magnetic navigation",
    "aeromagnetic compensation",
    "aircraft interference",
    "signal enhancement",
    "flight data",
    "HDF5",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Documentation = "https://dyuu7.github.io/dafmit-aeromag/"
Issues = "https://github.com/dyuu7/dafmit-aeromag/issues"
Repository = "https://github.com/dyuu7/dafmit-aeromag"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "build>=1.2",
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocs-static-i18n>=1.3,<2",
    "mkdocstrings[python]>=0.25",
    "pyright>=1.1.390",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dafmit_aeromag"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/scripts",
    "/README.md",
    "/README.zh-CN.md",
    "/CITATION.cff",
    "/LICENSE",
    "/mkdocs.yml",
    "/pyproject.toml",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = ["integration: verifies real Zenodo flight files from both collections"]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["dafmit_aeromag"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PT"]

[tool.pyright]
include = ["src", "scripts"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
reportMissingImports = false
